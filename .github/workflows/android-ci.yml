name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest PR validation active to avoid wasting Actions minutes.
concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore pinned sherpa-onnx AAR
        working-directory: android
        shell: bash
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-1.13.4.aar" \
            --output app/libs/sherpa-onnx-v1.13.4.aar
          expected="$(awk '$2 == "./android/app/libs/sherpa-onnx-v1.13.4.aar" { print $1 }' ../SHA256SUMS-SOURCE.txt)"
          test -n "$expected"
          echo "$expected  app/libs/sherpa-onnx-v1.13.4.aar" | sha256sum --check --strict

      - name: Run unit tests
        working-directory: android
        run: bash ./gradlew --no-daemon testDebugUnitTest

      - name: Run Android lint
        working-directory: android
        run: bash ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug


  voip_backend:
    name: Self-hosted VoIP security and privacy tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/voip/requirements.txt

      - name: Install pinned local VoIP runtime dependencies
        run: python -m pip install --requirement server/voip/requirements.txt

      - name: Import and compile local VoIP service
        working-directory: server/voip
        run: |
          python -m compileall -q .
          python -c "import server; print('AURA local WebRTC server import: OK')"

      - name: Run security, consent and ASR-quality unit tests
        working-directory: server/voip
        run: python -m unittest -v test_aura_security.py test_aura_privacy.py test_aura_asr_quality.py
